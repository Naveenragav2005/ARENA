<title>ARENA Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a bright course-site shell. Left rail lists five chapters and 42 weeks; the main pane shows the dashboard, a chapter overview, one week's workspace, or the journal. Each chapter owns one vivid hue, and the 42-cell week map is the page's signature. Single bright look by design. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --raise:#eef0f6; --line:#dde1eb;
  --ink:#141a2e; --muted:#5a6377;
  --good:#0f8a5a; --warn:#b4521a;
  --c0:#f2a900; --c1:#2f6fed; --c2:#12a36b; --c3:#f0562e; --c4:#8b4be8;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.k0{--c:var(--c0);--on:#141a2e}.k1{--c:var(--c1);--on:#fff}.k2{--c:var(--c2);--on:#fff}.k3{--c:var(--c3);--on:#fff}.k4{--c:var(--c4);--on:#fff}
.k0,.k1,.k2,.k3,.k4{--ct:color-mix(in srgb,var(--c) 58%,#141a2e);--tint:color-mix(in srgb,var(--c) 9%,#fff);--tint2:color-mix(in srgb,var(--c) 22%,#fff)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:316px minmax(0,1fr);min-height:100%}

/* rail */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{display:grid;grid-template-columns:repeat(5,6px);gap:2px}
.logo i{height:18px;border-radius:2px}
.brand b{font:700 19px var(--display);letter-spacing:-.01em}
.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.navlinks{display:flex;gap:6px}
.navlinks a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:500;padding:7px 8px;border:1px solid var(--line);border-radius:8px}
.navlinks a:hover{background:var(--raise)}
.navlinks a.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.nlink{display:flex;justify-content:space-between;align-items:center;text-decoration:none;font-size:14px;font-weight:500;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.nlink:hover{border-color:var(--ink)}
.nlink span{font:400 12px var(--mono);color:var(--muted)}
.urlrow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.urlrow label{font-size:13px;font-weight:500;color:var(--muted)}
.urlrow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.chs{display:flex;flex-direction:column;gap:6px;flex:1}
.ch summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-radius:8px}
.ch summary::-webkit-details-marker{display:none}
.ch summary:hover{background:var(--tint)}
.chn{font:700 11px var(--mono);width:20px;height:20px;border-radius:5px;background:var(--c);color:var(--on);display:grid;place-items:center}
.ch-name{font-weight:600;font-size:14px}
.ch-count{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ch-bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--raise);overflow:hidden}
.ch-bar i{display:block;height:100%;background:var(--c);transition:width .25s}
.rows{list-style:none;margin:2px 0 6px;padding:0}
.row{display:grid;grid-template-columns:18px 22px minmax(0,1fr);gap:6px;align-items:start;padding:6px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.35;color:var(--muted)}
.row:hover{background:var(--tint);color:var(--ink)}
.row.sel{background:var(--tint2);color:var(--ink);font-weight:500}
.row.now .rn{color:var(--ct);font-weight:500}
.row.over{grid-template-columns:minmax(0,1fr);font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ct)}
.rn{font:400 12px/1.5 var(--mono);font-variant-numeric:tabular-nums}
.tick{width:14px;height:14px;border-radius:50%;border:1.5px solid #aab1c2;margin-top:2px;position:relative}
.row.part .tick{border-color:var(--c);background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.row.done .tick{border-color:var(--good);background:var(--good)}
.row.done .tick::after{content:'';position:absolute;left:3.5px;top:1px;width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.row.done{color:var(--ink)}
.empty{font-size:13px;color:var(--muted);padding:6px}
.status{font:400 12px var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* main */
.main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.eyebrow{font:500 12px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ct,var(--muted))}
h1{font:700 clamp(30px,5.2vw,52px)/1.02 var(--display);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font:600 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.lede{margin:10px 0 0;color:var(--muted);max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#263055}
.btn.primary.is-done{background:var(--good);border-color:var(--good)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meter{height:7px;border-radius:4px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--ink));border-radius:4px;transition:width .25s}
.badge{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:5px;background:var(--raise);color:var(--muted)}
.badge.rec{background:var(--c);color:var(--on)}
.badge.core{background:var(--ink);color:#fff}

/* week map */
.map{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;text-decoration:none;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ct);border:1.5px solid transparent;transition:transform .12s}
.cell:hover{transform:translateY(-2px);border-color:var(--c)}
.cell.done{background:var(--c)!important;color:var(--on)}
.cell.now{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px}
.legend a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted)}
.legend a:hover{color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* dashboard */
.focus{background:var(--tint);border-color:var(--tint2);display:flex;flex-direction:column;gap:12px;padding:22px}
.focus h3{font:700 clamp(22px,3.2vw,30px)/1.12 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.focus p{margin:0}
.focus-top{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.focus-top span:last-child{font:400 13px var(--mono);color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;font:400 13px var(--mono);color:var(--muted)}
.duo>div{display:flex;flex-direction:column;gap:6px}
.focus .meter{background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile .k{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 32px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.tile .s.ahead{color:var(--good)}.tile .s.behind{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart .t{fill:var(--muted);font:11px var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goalline{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .bar.zero{fill:var(--line)}
.chart .bar.low{opacity:.5}
.chart .bar.cur{stroke:var(--ink);stroke-width:1.5}
.chart a:hover .bar,.chart a:focus .bar{stroke:var(--ink);stroke-width:1.5}
.note-s{font-size:13px;color:var(--muted);margin:8px 0 0}
.chcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chcard{text-decoration:none;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.chcard:hover{border-color:var(--c);transform:translateY(-2px)}
.chcard .big{position:absolute;right:10px;top:-14px;font:700 92px/1 var(--display);color:var(--tint2);pointer-events:none}
.chcard b{font:700 20px/1.15 var(--display);position:relative;max-width:11em}
.chcard .meta{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.chcard .next{font-size:13.5px;color:var(--muted)}
.miles{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.miles a{font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);border-radius:999px;color:var(--muted);display:flex;gap:6px;align-items:center;text-decoration:none}
.miles a::before{content:'';width:8px;height:8px;border-radius:50%;border:1.5px solid #aab1c2}
.miles a.on{color:var(--ink);border-color:var(--good)}
.miles a.on::before{background:var(--good);border-color:var(--good)}
.cmd{display:flex;gap:8px;align-items:center;margin-top:6px;background:var(--ink);border-radius:8px;padding:6px 6px 6px 12px;min-width:0}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font:400 13px var(--mono);color:#e8ecf8}
.cmd .btn{flex:none}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.hint a,.links a{color:var(--ct,#2f55c8)}

/* chapter and week headers */
.hero{background:var(--tint);border:1px solid var(--tint2);border-radius:18px;padding:26px 24px;position:relative;overflow:hidden}
.hero .big{position:absolute;right:16px;bottom:-34px;font:700 190px/1 var(--display);letter-spacing:-.04em;color:var(--tint2);pointer-events:none;user-select:none}
.hero>*:not(.big){position:relative}
.hero h1{max-width:15em}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:14px;font:400 13px var(--mono);color:var(--muted)}
.hero .goal{margin:16px 0 0;max-width:56ch;font-size:17px}
.hero .goal span{display:block;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ct)}
.hl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.wl{list-style:none;margin:0;padding:0}
.wl a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 6px;border-top:1px solid var(--line);text-decoration:none}
.wl li:first-child a{border-top:0}
.wl a:hover{background:var(--tint)}
.wl .n{font:500 15px var(--mono);color:var(--ct)}
.wl .st{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
.wl .t{font-weight:500}
.wl .t .badge{margin-left:8px;vertical-align:1px}
.wl .done .t{color:var(--muted)}

/* week workspace */
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border-radius:8px}
.step:hover{background:var(--tint,var(--raise))}
.step input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.step label{cursor:pointer;overflow-wrap:anywhere}
.step.on label{color:var(--muted);text-decoration:line-through}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.x:hover{color:var(--warn);background:var(--raise)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head span{font:400 12px var(--mono);color:var(--muted)}
.hrs{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hrs input{width:84px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 6px;font:500 18px var(--mono)}
.hrs .btn{padding:7px 12px}
.timer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.clock{font:500 22px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.clock.run{color:var(--good)}
.links{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.sum{display:flex;flex-direction:column;gap:12px}
.sum label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
textarea{width:100%;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;line-height:1.5}
textarea:focus,input:focus{background:var(--surface)}
.sum textarea{min-height:44px}
#notes{min-height:150px}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

/* journal */
.entry{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--c)}
.entry h3{margin:0;font:700 19px/1.2 var(--display)}
.entry dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14.5px}
.entry dt{color:var(--muted);font-size:13px;padding-top:1px}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 14.5px/1.5 var(--body);border-top:1px solid var(--line);padding-top:8px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:860px){
  .shell{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar b{font:700 17px var(--display)}
  .topbar span{margin-left:auto;font:400 12px var(--mono);color:var(--muted)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(20,26,46,.45)}
  .main{padding-top:20px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .map{grid-template-columns:repeat(14,minmax(0,1fr))}
  .hero .big{font-size:120px;bottom:-22px;opacity:.7}
}
@media (max-width:520px){
  .map{grid-template-columns:repeat(7,minmax(0,1fr))}
  .hero{padding:20px 16px}
  .wl a{grid-template-columns:30px minmax(0,1fr)}
  .wl .st{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function flush(){

    try{await col.doc('w'+ks[i]).set(JSON.parse(JSON.stringify(gw(ks[i]))));failed=false;}
    catch(e){failed=true;}

}
function adopt(snap){
  var changed=false;
  snap.docs.forEach(function(d){
    var m=/^w(\d+)$/.exec(d.id),o=d.data();
    if(!m||!o)return;
    var n=+m[1];if(n<0||n>42)return;

async function connect(){

    if(!user||!db)return;
    var id=await user.id();if(!id)return;
    var c=db.collection('data/users/'+id);
    var snap=await Promise.race([c.get(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},10000);})]);
    col=c;
    var remote={};snap.docs.forEach(function(d){var o=d.data();remote[d.id]=(o&&o.t)||0;});
    adopt(snap);
    /* push anything this browser has that the account lacks */
    Object.keys(S.w).forEach(function(n){if((gw(n).t||0)>(remote['w'+n]||0))dirty[n]=1;});
    if(Object.keys(dirty).length)flush();
    setStatus();
    c.onSnapshot(adopt,function(){});
  }catch(e){setStatus();}
}

  var cols=['#f2a900','#2f6fed','#12a36b','#f0562e','#8b4be8'],ps=[],i,t0=performance.now();
  for(i=0;i<70;i++)ps.push({x:w/2+(Math.random()-.5)*w*.5,y:h*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:5+Math.random()*7,c:cols[i%5],r:Math.random()*6});

}

    if(v2<=0)cls+=' zero';else if(v2<10)cls+=' low';
    if(n===cw)cls+=' cur';
    s+='<a href="#w'+n+'"><rect class="'+cls+'" fill="var(--c'+chapterOf(n).id+')" x="'+x.toFixed(1)+'" y="'+(y(0)-hh).toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" rx="2"><title>Week '+n+': '+(v2>0?fmtH(v2)+' hours':'no hours logged')+'</title></rect></a>';
  }
  CH.forEach(function(c){
    var x1=pl+(c.from-1)*(bw+gap),x2=pl+(c.to-1)*(bw+gap)+bw;
    s+='<text class="t" x="'+((x1+x2)/2).toFixed(1)+'" y="'+(Ht-8)+'" text-anchor="middle">Ch '+c.id+'</text>';
  });
  return s+'</svg>';
}

/* dashboard */
function viewHome(){
  var tt=totals(),days=daysFromStart(),cw=curWeek(),before=days<0,after=cw>42,fw=focusWeek();
  var g=gw(fw),w=W[fw-1],c=chapterOf(fw),st=stepStat(fw),fh=+g.h||0,su=stepStat(0);
  var head,lede;
  if(before){head='Starts Monday 16 Nov';lede='In '+(-days)+' day'+(-days===1?'':'s')+'. Use the time to get the environment installed. Week 1 is NumPy, einops and tensor shapes.';}
  else if(after){head='The plan has run its 42 weeks';lede=tt.done+' of 42 weeks ticked off. Use the buffer weeks to close any gaps.';}
  else{head='Week '+cw+' of 42';lede='Tick steps as you finish them, log your hours, and write the five-line summary on Sunday.';}
  var h='<header><div class="eyebrow">ARENA study plan &middot; 16 Nov 2026 to 5 Sep 2027</div><h1>'+head+'</h1><p class="lede">'+lede+'</p></header>';

  h+='<section class="card"><div class="head"><h2>The 42 weeks</h2><span>'+tt.done+' done</span></div>'+weekMap()+'</section>';

  h+='<section class="card focus k'+c.id+'"><div class="focus-top"><span class="eyebrow">'+(before?'Up next':(after?'Last week':'This week'))+' &middot; Chapter '+c.id+'</span><span>Week '+fw+' &middot; '+range(fw)+'</span></div>'
    +'<h3>'+esc(w[1])+'</h3><p><b>Done when:</b> '+esc(w[2])+'</p>'
    +'<div class="duo"><div><span>'+st.d+' of '+st.n+' steps</span><div class="meter"><i style="width:'+(st.d/st.n*100)+'%"></i></div></div>'
    +'<div><span>'+fmtH(fh)+' of '+TARGET+' h</span><div class="meter"><i style="width:'+Math.min(100,fh/TARGET*100)+'%"></i></div></div></div>'
    +'<div class="actions"><a class="btn primary" href="#w'+fw+'">Open week '+fw+'</a>'
    +'<button class="btn" type="button" data-act="addh" data-n="'+fw+'" data-v="1">+1 h</button>'
    +'<button class="btn" type="button" data-act="done" data-n="'+fw+'">'+(g.d?'Week done. Undo':'Mark week done')+'</button></div></section>';

  var setup='<section class="card"><div class="head"><h2>Get set up</h2><span>'+su.d+' of '+su.n+'</span></div>'+stepList(0)+'</section>';
  if(su.d<su.n)h+=setup;

  var pace='&ndash;',ps='Compared from week 2',pc='s';
  if(!before&&cw>=2){
    var el=Math.min(cw-1,42),lg=0;for(var k=1;k<=el;k++)lg+=+gw(k).h||0;
    var delta=lg-TARGET*el;pace=(delta>0?'+':'')+fmtH(delta)+' h';
    if(delta>=0){ps='Ahead of '+TARGET+' h a week';pc='s ahead';}else{ps='Behind '+TARGET+' h a week';pc='s behind';}
  }
  h+='<section class="tiles" aria-label="Progress">'
    +'<div class="card tile"><div class="k">Weeks done</div><div class="v">'+tt.done+' / 42</div><div class="s">'+Math.round(tt.done/42*100)+'% of the plan</div></div>'
    +'<div class="card tile"><div class="k">Steps ticked</div><div class="v">'+tt.sd+' / '+tt.sn+'</div><div class="s">Across all chapters</div></div>'
    +'<div class="card tile"><div class="k">Hours logged</div><div class="v">'+fmtH(tt.hours)+'</div><div class="s">Target 10 to 13 h a week</div></div>'
    +'<div class="card tile"><div class="k">Against plan</div><div class="v">'+pace+'</div><div class="'+pc+'">'+ps+'</div></div></section>';

  h+='<section><h2>Chapters</h2><div class="chcards">';
  CH.forEach(function(ch){
    var dn=0,next=0,tot=ch.to-ch.from+1;
    for(var n=ch.from;n<=ch.to;n++){if(gw(n).d)dn++;else if(!next)next=n;}
    h+='<a class="card chcard k'+ch.id+'" href="#ch'+ch.id+'"><span class="big" aria-hidden="true">'+ch.id+'</span><span class="eyebrow">Chapter '+ch.id+'</span><b>'+esc(ch.name)+'</b>'
      +'<div class="meter"><i style="width:'+(dn/tot*100)+'%"></i></div>'
      +'<div class="meta"><span>Weeks '+ch.from+' to '+ch.to+'</span><span>'+dn+' / '+tot+'</span></div>'
      +'<span class="next">'+(next?'Next: '+esc(W[next-1][1]):'Chapter complete')+'</span></a>';
  });
  h+='</div></section>';

  h+='<section class="card chart"><h2>Hours per week</h2>'+chart()+'<p class="note-s">Dashed line is the 11 h core week. Faded bars are under 10 h. Select a bar to open that week.</p></section>';
  h+='<section><h2>Milestones</h2><ul class="miles">'+MILES.map(function(m){return '<li><a href="#w'+m.w+'"'+(gw(m.w).d?' class="on"':'')+'>'+esc(m.t)+'</a></li>';}).join('')+'</ul></section>';
  if(su.d>=su.n)h+=setup;
  h+='<section><h2>Links</h2><div class="actions"><a class="btn primary" href="'+NOTION+'" target="_blank" rel="noopener">My Notion: ARENA</a><a class="btn" href="'+SITE+'" target="_blank" rel="noopener">Course site</a><a class="btn" href="'+REPO+'" target="_blank" rel="noopener">ARENA_materials on GitHub</a><a class="btn" href="'+SLACK+'" target="_blank" rel="noopener">Slack invite</a></div><p class="note-s">Found a mistake in the material? Report it in #errata on the Slack.</p></section>';
  return h;
}

/* chapter overview */
function viewChapter(id){
  var c=CH[id],dn=0,tot=c.to-c.from+1,next=0,n;
  for(n=c.from;n<=c.to;n++){if(gw(n).d)dn++;else if(!next)next=n;}
  var h='<header class="hero k'+id+'"><span class="big" aria-hidden="true">'+id+'</span><div class="eyebrow">Chapter '+id+' &middot; Weeks '+c.from+' to '+c.to+' &middot; from '+weekStart(c.from).getDate()+' '+MON[weekStart(c.from).getMonth()]+'</div><h1>'+esc(c.name)+'</h1>'
    +'<p class="goal">'+esc(c.desc)+'</p>'
    +'<div class="meta"><span>'+dn+' of '+tot+' weeks done</span></div>'
    +'<div class="actions" style="margin-top:16px">'+(next?'<a class="btn primary" href="#w'+next+'">'+(dn?'Continue with':'Start')+' week '+next+'</a>':'')+'<a class="btn" href="'+c.url+'" target="_blank" rel="noopener">Open chapter on ARENA</a></div></header>';
  h+='<section class="card k'+id+'"><h2>What you will build</h2><ul class="hl">'+c.hi.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section>';
  h+='<section class="card k'+id+'"><h2>Weeks</h2><ul class="wl">';
  for(n=c.from;n<=c.to;n++){
    var st=stepStat(n),g=gw(n);
    h+='<li><a href="#w'+n+'"'+(g.d?' class="done"':'')+'><span class="n">'+pad2(n)+'</span><span class="t">'+esc(W[n-1][1])+tag(n)+'</span><span class="st">'+(g.d?'Done':st.d+'/'+st.n+' steps')+' &middot; '+range(n)+'</span></a></li>';
  }
  h+='</ul></section>';
  h+='<div class="pager">'+(id>0?'<a class="btn" href="#ch'+(id-1)+'">&larr; Chapter '+(id-1)+'</a>':'<span></span>')+(id<4?'<a class="btn" href="#ch'+(id+1)+'">Chapter '+(id+1)+' &rarr;</a>':'<span></span>')+'</div>';
  return h;
}

/* week workspace */
function viewWeek(n){
  var g=gw(n),w=W[n-1],c=chapterOf(n),ss=stepStat(n),hv=+g.h||0,sm=g.s||[],rd=READ[n]||[];
  var h='<header class="hero k'+c.id+'"><span class="big" aria-hidden="true">'+pad2(n)+'</span><div class="eyebrow"><a href="#ch'+c.id+'" style="text-decoration:none">Chapter '+c.id+' &middot; '+esc(c.name)+'</a></div><h1>'+esc(w[1])+'</h1>'
    +'<div class="meta"><span>Week '+n+' &middot; '+range(n)+(n===curWeek()?' &middot; this week':'')+'</span>'+tag(n)+'</div>'
    +'<p class="goal"><span>Done when</span>'+esc(w[2])+'</p>'
    +'<div class="actions" style="margin-top:16px"><button class="btn primary'+(g.d?' is-done':'')+'" type="button" id="done-btn" data-act="done" data-n="'+n+'" aria-pressed="'+(g.d?'true':'false')+'">'+(g.d?'Week done':(ss.d===ss.n?'All steps ticked. Mark week done':'Mark week done'))+'</button>'
    +'<a class="btn" href="'+c.url+'" target="_blank" rel="noopener">Open Chapter '+c.id+' on ARENA</a></div></header>';

  h+='<div class="cols"><section class="card k'+c.id+'"><div class="head"><h2>Steps</h2><span>'+ss.d+' of '+ss.n+'</span></div>'+stepList(n)
    +'<form class="addrow" id="addstep"><input id="newstep" placeholder="Add your own step" aria-label="Add your own step" maxlength="140" autocomplete="off"><button class="btn" type="submit">Add</button></form></section>';

  var run=T&&T.w===n;
  h+='<div style="display:flex;flex-direction:column;gap:16px;min-width:0"><section class="card k'+c.id+'"><div class="head"><h2>Hours</h2><span id="h-of">'+fmtH(hv)+' of '+TARGET+' h</span></div>'
    +'<div class="hrs"><button class="btn" type="button" data-act="addh" data-n="'+n+'" data-v="-0.5" aria-label="Remove half an hour">&minus;</button>'
    +'<input type="number" id="hours" min="0" max="60" step="0.25" inputmode="decimal" aria-label="Hours this week" value="'+(g.h==null?'':g.h)+'" placeholder="0">'
    +'<button class="btn" type="button" data-act="addh" data-n="'+n+'" data-v="0.5" aria-label="Add half an hour">+</button>'
    +'<button class="btn" type="button" data-act="addh" data-n="'+n+'" data-v="1">+1 h</button></div>'
    +'<div class="meter"><i id="h-fill" style="width:'+Math.min(100,hv/TARGET*100)+'%"></i></div>'
    +'<div class="timer"><span class="clock'+(run?' run':'')+'"'+(run?' id="clock"':'')+'>'+(run?clockText():'0:00:00')+'</span>'
    +(run?'<button class="btn" type="button" data-act="tstop">Stop and log time</button>'
         :'<button class="btn" type="button" data-act="tstart" data-n="'+n+'">'+(T?'Timer runs on week '+T.w+'. Switch here':'Start study timer')+'</button>')
    +'</div></section>';
  if(rd.length)h+='<section class="card k'+c.id+'"><h2>Reading</h2><ul class="links">'+rd.map(function(r){return '<li><a href="'+r[1]+'" target="_blank" rel="noopener">'+esc(r[0])+'</a></li>';}).join('')+'</ul></section>';
  var nu=notionUrl(g.u);
  h+='<section class="card k'+c.id+'"><h2>Notion</h2><div class="actions">'+(nu?'<a class="btn primary" href="'+esc(nu)+'" target="_blank" rel="noopener">Open this week\'s page</a>':'')+'<a class="btn" href="'+NOTION+'" target="_blank" rel="noopener">ARENA workspace</a></div>'
    +'<div class="urlrow"><label for="nurl">Notion page for this week</label><input id="nurl" type="url" inputmode="url" placeholder="Paste a Notion link" autocomplete="off" spellcheck="false" value="'+esc(g.u||'')+'">'+(g.u&&!nu?'<span class="hint">That is not a Notion link, so no button is shown.</span>':'')+'</div></section>';
  h+='</div></div>';

  h+='<section class="card"><h2>Five-line summary</h2><div class="sum">';
  SUM.forEach(function(lb,i){
    h+='<div><label for="sum'+i+'">'+lb+'</label><textarea id="sum'+i+'" data-sum="'+i+'" rows="1">'+esc(sm[i]||'')+'</textarea></div>';
  });
  h+='</div></section>';
  h+='<section class="card"><h2><label for="notes">Notes</label></h2><textarea id="notes" placeholder="Shapes that tripped you up, links, questions to come back to...">'+esc(g.n||'')+'</textarea></section>';
  h+='<div class="pager">'+(n>1?'<a class="btn" href="#w'+(n-1)+'">&larr; Week '+(n-1)+'</a>':'<span></span>')+(n<42?'<a class="btn" href="#w'+(n+1)+'">Week '+(n+1)+' &rarr;</a>':'<a class="btn" href="#journal">Journal &rarr;</a>')+'</div>';
  return h;
}

/* journal */
function journalText(){
  var tt=totals(),lines=['ARENA tracker: '+tt.done+' of 42 weeks done, '+fmtH(tt.hours)+' hours logged'];
  for(var n=1;n<=42;n++){
    var g=gw(n),st=stepStat(n);
    if(!(g.d||g.h||st.d||hasText(g)))continue;
    lines.push('','Week '+n+(g.d?' [done] ':' [open] ')+W[n-1][1]+' ('+st.d+'/'+st.n+' steps'+(g.h?', '+fmtH(g.h)+' h':'')+')');
    (g.s||[]).forEach(function(x,i){if(x&&x.trim())lines.push('  '+SUM[i]+': '+x.trim());});
    if(g.n&&g.n.trim())lines.push('  Notes: '+g.n.trim().replace(/\n/g,'\n  '));
  }
  return lines.join('\n');
}
function viewJournal(){
  var h='<header><div class="eyebrow">Everything you have written</div><h1>Journal</h1><p class="lede">Your summaries and notes, week by week. Use the search box to find a word in any entry.</p></header>';
  h+='<div class="actions"><button class="btn" type="button" data-act="copy">Copy progress as text</button></div>';
  var any=false;
  for(var n=1;n<=42;n++){
    var g=gw(n);if(!hasText(g)||!matches(n))continue;
    any=true;var c=chapterOf(n);
    h+='<article class="card entry k'+c.id+'"><div class="eyebrow">Week '+n+' &middot; '+range(n)+(g.d?' &middot; done':'')+(g.h?' &middot; '+fmtH(g.h)+' h':'')+'</div><h3>'+esc(W[n-1][1])+'</h3><dl>';
    (g.s||[]).forEach(function(x,i){if(x&&x.trim())h+='<dt>'+SUM[i]+'</dt><dd>'+esc(x.trim())+'</dd>';});
    h+='</dl>'+(g.n&&g.n.trim()?'<pre>'+esc(g.n.trim())+'</pre>':'')+'<div class="actions"><a class="btn sm" href="#w'+n+'">Edit week '+n+'</a></div></article>';
  }
  if(!any)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+(query?'No entry matches "'+esc(query)+'".':'Nothing written yet. Open a week and fill in the five-line summary or the notes box. Entries appear here as you type them.')+'</p></div>';
  return h;
}

/* render, keeping keyboard focus where it was */
function render(){
  var r=route(),a=document.activeElement,fid=a&&a.id&&$('#view').contains(a)?a.id:null,ss=null,se=null;
  if(fid&&a.selectionStart!=null&&a.type!=='number'&&a.type!=='checkbox'){try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}}
  $('#view').innerHTML=r.v==='week'?viewWeek(r.n):(r.v==='chapter'?viewChapter(r.c):(r.v==='journal'?viewJournal():viewHome()));
  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}}}
  grow();renderSide();setStatus();
}
function grow(){
  document.querySelectorAll('.sum textarea').forEach(function(t){t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight+2)+'px';});
}
function addHours(n,v){
  var h=Math.min(60,Math.max(0,(+gw(n).h||0)+v));
  setW(n,{h:h||null});
}
function flash(b,m){var o=b.textContent;b.textContent=m;setTimeout(function(){b.textContent=o;},1800);}
function copy(b,txt){
  try{navigator.clipboard.writeText(txt).then(function(){flash(b,'Copied');},function(){flash(b,'Copy is blocked here');});}catch(err){flash(b,'Copy is blocked here');}
}

/* events */
var view=$('#view');
view.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),r=route(),n=+b.getAttribute('data-n')||r.n;
  if(act==='done'){var was=gw(n).d;setW(n,{d:was?0:1});if(!was)burst();}
  else if(act==='addh'){addHours(n,+b.getAttribute('data-v'));}
  else if(act==='rmstep'){
    var k=b.getAttribute('data-k'),g=gw(n),c=Object.assign({},g.c);delete c[k];
    setW(n,{x:(g.x||[]).filter(function(o){return o.i!==k;}),c:c});
  }
  else if(act==='tstart'){T={w:n,start:Date.now()};saveT();render();}
  else if(act==='tstop'){
    if(!T)return;
    var hrs=Math.round((Date.now()-T.start)/36e5*100)/100,tw=T.w;T=null;saveT();
    if(hrs>0)addHours(tw,hrs);else render();
  }
  else if(act==='copy'){copy(b,journalText());}
  else if(act==='copycmd'){copy(b,b.getAttribute('data-v'));}
});
view.addEventListener('change',function(e){
  if(e.target.id==='nurl'){render();return;}
  var k=e.target.getAttribute('data-step');
  if(k==null)return;
  var n=+e.target.getAttribute('data-w'),c=Object.assign({},gw(n).c);
  if(e.target.checked)c[k]=1;else delete c[k];
  setW(n,{c:c});
});
view.addEventListener('input',function(e){
  var r=route(),t=e.target;if(r.v!=='week')return;
  if(t.id==='notes'){setW(r.n,{n:t.value},true);}
  else if(t.id==='nurl'){setW(r.n,{u:t.value.trim()},true);}
  else if(t.hasAttribute('data-sum')){
    var s=(gw(r.n).s||[]).slice();while(s.length<5)s.push('');
    s[+t.getAttribute('data-sum')]=t.value;setW(r.n,{s:s},true);grow();
  }
  else if(t.id==='hours'){
    var v=parseFloat(t.value);v=isNaN(v)?null:Math.min(60,Math.max(0,v));
    setW(r.n,{h:v},true);
    $('#h-of').textContent=fmtH(v||0)+' of '+TARGET+' h';
    $('#h-fill').style.width=Math.min(100,(v||0)/TARGET*100)+'%';
  }
});
view.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id!=='addstep')return;
  var r=route(),inp=$('#newstep'),t=inp.value.trim();
  if(!t||r.v!=='week')return;
  var x=(gw(r.n).x||[]).concat([{i:'x'+Date.now().toString(36),t:t}]);
  inp.value='';setW(r.n,{x:x});$('#newstep').focus();
});
$('#q').addEventListener('input',function(e){
  query=e.target.value.trim().toLowerCase();
  if(route().v==='journal')render();else renderSide();
});
function closeNav(){document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');}
document.addEventListener('keydown',function(e){
  var t=e.target,typing=/^(INPUT|TEXTAREA)$/.test(t.tagName);
  if(e.key==='Escape'){closeNav();if(t.id==='q'){t.value='';query='';renderSide();t.blur();}return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  var r=route();
  if(e.key==='/'){e.preventDefault();document.body.classList.add('nav-open');$('#q').focus();}
  else if(e.key==='['&&r.v==='week'&&r.n>1){location.hash='w'+(r.n-1);}
  else if(e.key===']'&&r.v==='week'&&r.n<42){location.hash='w'+(r.n+1);}
});
$('#menu').addEventListener('click',function(){
  var o=document.body.classList.toggle('nav-open');this.setAttribute('aria-expanded',o?'true':'false');
});
$('#side').addEventListener('click',function(e){if(e.target.closest('a'))closeNav();});
document.addEventListener('click',function(e){
  if(document.body.classList.contains('nav-open')&&!e.target.closest('#side')&&!e.target.closest('#menu'))closeNav();
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

/* start */
loadLocal();
render();
connect();
})();
</script>
