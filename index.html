<title>ARENA Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a course-site shell. Left rail lists the five chapters and 42 weeks; the main pane shows the dashboard, one week's workspace, or the journal. Each chapter owns one hue. */
:root{
  --bg:#14161b; --surface:#1b1e25; --raise:#232730; --line:#2c313b;
  --ink:#eceff4; --muted:#9aa3b0;
  --gold:#ddb665; --on-gold:#1a1405; --good:#7ccf9b; --warn:#e8a26b;
  --c0:#ddb665; --c1:#7fb2e8; --c2:#7ccf9b; --c3:#e8916f; --c4:#b79cf0;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f6; --surface:#ffffff; --raise:#e8eaef; --line:#d3d7df;
  --ink:#171a20; --muted:#59626f;
  --gold:#8a6508; --on-gold:#ffffff; --good:#1f7a46; --warn:#a4561a;
  --c0:#8a6508; --c1:#2566b0; --c2:#1f7a46; --c3:#b4502a; --c4:#6b46c1;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f3f6; --surface:#ffffff; --raise:#e8eaef; --line:#d3d7df;
  --ink:#171a20; --muted:#59626f;
  --gold:#8a6508; --on-gold:#ffffff; --good:#1f7a46; --warn:#a4561a;
  --c0:#8a6508; --c1:#2566b0; --c2:#1f7a46; --c3:#b4502a; --c4:#6b46c1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.k0{--c:var(--c0)}.k1{--c:var(--c1)}.k2{--c:var(--c2)}.k3{--c:var(--c3)}.k4{--c:var(--c4)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100%}

/* rail */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;text-decoration:none}
.brand b{font:600 18px var(--body);letter-spacing:.02em}
.brand span{font:400 12px var(--mono);color:var(--muted)}
.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.navlinks{display:flex;gap:6px}
.navlinks a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:500;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.navlinks a.sel{border-color:var(--gold);color:var(--gold)}
.chs{display:flex;flex-direction:column;gap:6px;flex:1}
.ch summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-radius:6px}
.ch summary::-webkit-details-marker{display:none}
.ch summary:hover{background:var(--raise)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ch-name{font-weight:600;font-size:14px}
.ch-count{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ch-bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--raise);overflow:hidden}
.ch-bar i{display:block;height:100%;background:var(--c);transition:width .25s}
.rows{list-style:none;margin:2px 0 6px;padding:0}
.row{display:grid;grid-template-columns:18px 22px minmax(0,1fr);gap:6px;align-items:start;padding:6px;border-radius:6px;text-decoration:none;font-size:13.5px;line-height:1.35;color:var(--muted)}
.row:hover{background:var(--raise);color:var(--ink)}
.row.sel{background:var(--raise);color:var(--ink);box-shadow:inset 2px 0 0 var(--c)}
.row.now .rn{color:var(--c)}
.rn{font:400 12px/1.5 var(--mono);font-variant-numeric:tabular-nums}
.tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);margin-top:2px;position:relative}
.row.part .tick{border-color:var(--c);background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.row.done .tick{border-color:var(--good);background:var(--good)}
.row.done .tick::after{content:'';position:absolute;left:3.5px;top:1px;width:3px;height:6px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.row.done{color:var(--ink)}
.empty{font-size:13px;color:var(--muted);padding:6px}
.status{font:400 12px var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* main */
.main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.eyebrow{font:500 12px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--gold))}
h1{font:600 clamp(26px,4.6vw,42px)/1.1 var(--body);margin:6px 0 0;text-wrap:balance}
h2{font:600 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary.is-done{background:var(--good);border-color:var(--good)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meter{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--gold));border-radius:3px;transition:width .25s}

/* dashboard */
.focus{border-left:3px solid var(--c);display:flex;flex-direction:column;gap:12px;padding:20px}
.focus h3{font:600 clamp(20px,3vw,26px)/1.2 var(--body);margin:0;text-wrap:balance}
.focus p{margin:0;color:var(--muted)}
.focus p b{color:var(--ink);font-weight:500}
.focus-top{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.focus-top span:last-child{font:400 13px var(--mono);color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;font:400 13px var(--mono);color:var(--muted)}
.duo>div{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile .k{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:500 28px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.tile .s.ahead{color:var(--good)}.tile .s.behind{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart .t{fill:var(--muted);font:11px var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goalline{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .bar.zero{fill:var(--line)}
.chart .bar.low{opacity:.5}
.chart .bar.cur{stroke:var(--ink);stroke-width:1.5}
.chart a:hover .bar,.chart a:focus .bar{stroke:var(--ink);stroke-width:1.5}
.note-s{font-size:13px;color:var(--muted);margin:8px 0 0}
.chcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.chcard{text-decoration:none;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--c)}
.chcard:hover{border-color:var(--c);background:var(--raise)}
.chcard b{font-size:17px;font-weight:600}
.chcard .meta{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.chcard .next{font-size:13.5px;color:var(--muted)}
.miles{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.miles a{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);display:flex;gap:6px;align-items:center;text-decoration:none}
.miles a::before{content:'';width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.miles a.on{color:var(--ink);border-color:var(--good)}
.miles a.on::before{background:var(--good);border-color:var(--good)}

/* week workspace */
.goalbox{border-left:3px solid var(--c);padding:12px 16px;background:var(--surface);border-radius:0 8px 8px 0}
.goalbox span{display:block;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border-radius:6px}
.step:hover{background:var(--raise)}
.step input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.step label{cursor:pointer;overflow-wrap:anywhere}
.step.on label{color:var(--muted);text-decoration:line-through}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.x:hover{color:var(--warn);background:var(--bg)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head span{font:400 12px var(--mono);color:var(--muted)}
.hrs{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hrs input{width:84px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 6px;font:500 18px var(--mono)}
.hrs .btn{padding:7px 12px}
.timer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.clock{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.clock.run{color:var(--good)}
.sum{display:flex;flex-direction:column;gap:12px}
.sum label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
textarea{width:100%;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;line-height:1.5}
.sum textarea{min-height:44px}
#notes{min-height:150px}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.pager .btn{max-width:100%}

/* journal */
.entry{display:flex;flex-direction:column;gap:8px}
.entry h3{margin:0;font-size:17px;font-weight:600}
.entry dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14.5px}
.entry dt{color:var(--muted);font-size:13px;padding-top:1px}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 14.5px/1.5 var(--body);border-top:1px solid var(--line);padding-top:8px}

@media (max-width:860px){
  .shell{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .topbar b{font-weight:600}
  .topbar span{margin-left:auto;font:400 12px var(--mono);color:var(--muted)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .main{padding-top:20px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function daysFromStart(){var t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((t0-START)/DAY);}
function curWeek(){return Math.floor(daysFromStart()/7)+1;}
function focusWeek(){return Math.min(42,Math.max(1,curWeek()));}
function chapterOf(n){for(var i=0;i<CH.length;i++){if(n>=CH[i].from&&n<=CH[i].to)return CH[i];}return CH[0];}

/* state: S.w[n] = {d:1, h:hours, c:{stepKey:1}, x:[{i,t}], s:[5 strings], n:notes, t:timestamp} */
var S={w:{}};
function gw(n){return S.w[n]||{};}
function steps(n){
  var a=W[n-1][3].map(function(t,i){return {k:'s'+i,t:t};});
  (gw(n).x||[]).forEach(function(o){a.push({k:o.i,t:o.t,custom:true});});
  return a;
}
function stepStat(n){var st=steps(n),c=gw(n).c||{},d=0;st.forEach(function(s){if(c[s.k])d++;});return {d:d,n:st.length};}
function hasText(g){return !!((g.n&&g.n.trim())||(g.s||[]).some(function(x){return x&&x.trim();}));}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.w)S=o;}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* saving: one small document per week in the viewer's private space */
var col=null,dirty={},saving=false,timer=null,failed=false;
function setStatus(){
  var t;
  if(Object.keys(dirty).length||saving)t=col?'Saving...':'Saved in this browser';
  else if(failed)t='Could not reach your account. Changes are kept in this browser.';
  else if(col)t='Saved to your Claude account';
  else t='Saved in this browser';
  $('#status').textContent=t;
}
function setW(n,patch,soft){
  var cur=Object.assign({},S.w[n],patch);cur.t=Date.now();S.w[n]=cur;
  saveLocal();dirty[n]=1;
  clearTimeout(timer);timer=setTimeout(flush,900);
  if(soft){renderSide();setStatus();}else render();
}
async function flush(){
  if(!col){dirty={};setStatus();return;}
  if(saving)return;
  saving=true;
  var ks=Object.keys(dirty);dirty={};
  for(var i=0;i<ks.length;i++){
    try{await col.doc('w'+ks[i]).set(JSON.parse(JSON.stringify(gw(ks[i]))));failed=false;}
    catch(e){failed=true;}
  }
  saving=false;
  if(Object.keys(dirty).length){clearTimeout(timer);timer=setTimeout(flush,300);}
  setStatus();
}
function adopt(snap){
  var changed=false;
  snap.docs.forEach(function(d){
    var m=/^w(\d+)$/.exec(d.id),o=d.data();
    if(!m||!o)return;
    var n=+m[1];if(n<1||n>42)return;
    if((o.t||0)>(gw(n).t||0)){S.w[n]=o;changed=true;}
  });
  if(changed){saveLocal();render();}
}
async function connect(){
  if(typeof claude==='undefined'||!claude||!claude.use)return;
  try{
    var user=await claude.use('user'),db=await claude.use('db');
    if(!user||!db)return;
    var id=await user.id();if(!id)return;
    var c=db.collection('data/users/'+id);
    var snap=await Promise.race([c.get(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},10000);})]);
    col=c;
    var remote={};snap.docs.forEach(function(d){var o=d.data();remote[d.id]=(o&&o.t)||0;});
    adopt(snap);
    /* push anything this browser has that the account lacks */
    Object.keys(S.w).forEach(function(n){if((gw(n).t||0)>(remote['w'+n]||0))dirty[n]=1;});
    if(Object.keys(dirty).length)flush();
    setStatus();
    c.onSnapshot(adopt,function(){});
  }catch(e){setStatus();}
}

/* timer */
var T=null;
try{T=JSON.parse(localStorage.getItem(TKEY)||'null');}catch(e){}
function saveT(){try{if(T)localStorage.setItem(TKEY,JSON.stringify(T));else localStorage.removeItem(TKEY);}catch(e){}}
function clockText(){
  if(!T)return '0:00:00';
  var s=Math.max(0,Math.floor((Date.now()-T.start)/1000));
  return Math.floor(s/3600)+':'+pad2(Math.floor(s/60)%60)+':'+pad2(s%60);
}
setInterval(function(){
  var el=$('#clock');if(el&&T)el.textContent=clockText();
  $('#top-info').textContent=T?'Timer '+clockText():'';
},1000);

/* route */
function route(){
  var h=(location.hash||'').replace('#','');
  var m=/^w(\d+)$/.exec(h);
  if(m&&+m[1]>=1&&+m[1]<=42)return {v:'week',n:+m[1]};
  if(h==='journal')return {v:'journal'};
  return {v:'home'};
}

/* rail */
var query='';
function matches(n){
  if(!query)return true;
  var g=gw(n),w=W[n-1];
  var hay=[w[1],w[2],'week '+n,steps(n).map(function(s){return s.t;}).join(' '),g.n||'',(g.s||[]).join(' ')].join(' ').toLowerCase();
  return hay.indexOf(query)>=0;
}
function buildSide(){
  var r=route(),cw=curWeek(),html='',any=false;
  CH.forEach(function(c){
    var rows='',dn=0,tot=c.to-c.from+1;
    for(var n=c.from;n<=c.to;n++){
      var g=gw(n),st=stepStat(n);if(g.d)dn++;
      if(!matches(n))continue;
      var cls='row'+(g.d?' done':(st.d||g.h||hasText(g)?' part':''))+(n===cw?' now':'')+(r.v==='week'&&r.n===n?' sel':'');
      rows+='<li><a class="'+cls+'" href="#w'+n+'"'+(r.v==='week'&&r.n===n?' aria-current="page"':'')+'><span class="tick"></span><span class="rn">'+pad2(n)+'</span><span>'+esc(W[n-1][1])+'</span></a></li>';
    }
    if(query&&!rows)return;
    any=true;
    var open=query||(r.v==='week'?chapterOf(r.n).id===c.id:chapterOf(focusWeek()).id===c.id)||openCh[c.id];
    html+='<details class="ch k'+c.id+'" data-ch="'+c.id+'"'+(open?' open':'')+'><summary><span class="dot"></span><span class="ch-name">'+esc(c.name)+'</span><span class="ch-count">'+dn+'/'+tot+'</span><span class="ch-bar"><i style="width:'+(dn/tot*100)+'%"></i></span></summary><ul class="rows">'+rows+'</ul></details>';
  });
  if(!any)html='<div class="empty">No week matches "'+esc(query)+'".</div>';
  return html;
}
var openCh={};
function renderSide(){
  var sc=$('#side').scrollTop;
  $('#chs').innerHTML=buildSide();
  $('#side').scrollTop=sc;
  var r=route();
  $('#nav-home').className=r.v==='home'?'sel':'';
  $('#nav-journal').className=r.v==='journal'?'sel':'';
}
$('#chs').addEventListener('toggle',function(e){
  var d=e.target;if(d.dataset&&d.dataset.ch!=null&&!query)openCh[d.dataset.ch]=d.open;
},true);

/* dashboard */
function totals(){
  var o={done:0,hours:0,sd:0,sn:0};
  for(var n=1;n<=42;n++){var g=gw(n),st=stepStat(n);if(g.d)o.done++;o.hours+=+g.h||0;o.sd+=st.d;o.sn+=st.n;}
  return o;
}
function chart(){
  var Wd=840,Ht=150,pl=30,pr=6,pt=10,pb=26,bw=15,gap=(Wd-pl-pr-42*bw)/41,hs=[],n,mx=14,cw=curWeek();
  for(n=1;n<=42;n++){var v=+gw(n).h||0;hs.push(v);if(v>mx)mx=Math.ceil(v);}
  function y(v){return pt+(Ht-pt-pb)*(1-v/mx);}
  var s='<svg viewBox="0 0 '+Wd+' '+Ht+'" role="img" aria-label="Hours logged in each of the 42 weeks against an 11 hour target">';
  s+='<line class="grid" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  s+='<line class="goalline" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+y(TARGET)+'" y2="'+y(TARGET)+'"/>';
  s+='<text class="t" x="'+(pl-6)+'" y="'+(y(TARGET)+4)+'" text-anchor="end">11</text><text class="t" x="'+(pl-6)+'" y="'+(y(0)+4)+'" text-anchor="end">0</text>';
  for(n=1;n<=42;n++){
    var x=pl+(n-1)*(bw+gap),v2=hs[n-1],cls='bar',hh=v2>0?Math.max(2,y(0)-y(v2)):2;
    if(v2<=0)cls+=' zero';else if(v2<10)cls+=' low';
    if(n===cw)cls+=' cur';
    s+='<a href="#w'+n+'"><rect class="'+cls+'" fill="var(--c'+chapterOf(n).id+')" x="'+x.toFixed(1)+'" y="'+(y(0)-hh).toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" rx="2"><title>Week '+n+': '+(v2>0?fmtH(v2)+' hours':'no hours logged')+'</title></rect></a>';
  }
  CH.forEach(function(c){
    var x1=pl+(c.from-1)*(bw+gap),x2=pl+(c.to-1)*(bw+gap)+bw;
    s+='<text class="t" x="'+((x1+x2)/2).toFixed(1)+'" y="'+(Ht-8)+'" text-anchor="middle">Ch '+c.id+'</text>';
  });
  return s+'</svg>';
}
function viewHome(){

  var h='<header><div class="eyebrow">ARENA study plan &middot; 16 Nov 2026 to 5 Sep 2027</div><h1>'+head+'</h1><p class="lede">'+lede+'</p></header>';

    +'<h3>'+esc(w[1])+'</h3><p><b>Done when:</b> '+esc(w[2])+'</p>'
    +'<div class="duo"><div><span>'+st.d+' of '+st.n+' steps</span><div class="meter"><i style="width:'+(st.d/st.n*100)+'%"></i></div></div>'

  var pace='&ndash;',ps='Compared from week 2',pc='s';
  if(!before&&cw>=2){
    var el=Math.min(cw-1,42),lg=0;for(var k=1;k<=el;k++)lg+=+gw(k).h||0;
    var delta=lg-TARGET*el;pace=(delta>0?'+':'')+fmtH(delta)+' h';
    if(delta>=0){ps='Ahead of '+TARGET+' h a week';pc='s ahead';}else{ps='Behind '+TARGET+' h a week';pc='s behind';}
  }
  h+='<section class="tiles" aria-label="Progress">'
    +'<div class="card tile"><div class="k">Weeks done</div><div class="v">'+tt.done+' / 42</div><div class="s">'+Math.round(tt.done/42*100)+'% of the plan</div></div>'
    +'<div class="card tile"><div class="k">Steps ticked</div><div class="v">'+tt.sd+' / '+tt.sn+'</div><div class="s">Across all chapters</div></div>'
    +'<div class="card tile"><div class="k">Hours logged</div><div class="v">'+fmtH(tt.hours)+'</div><div class="s">Target 10 to 13 h a week</div></div>'
    +'<div class="card tile"><div class="k">Against plan</div><div class="v">'+pace+'</div><div class="'+pc+'">'+ps+'</div></div></section>';

  h+='<section><h2>Chapters</h2><div class="chcards">';
  CH.forEach(function(ch){
    var dn=0,next=0,tot=ch.to-ch.from+1;

  });
  h+='</div></section>';

  h+='<section class="card chart"><h2>Hours per week</h2>'+chart()+'<p class="note-s">Dashed line is the 11 h core week. Faded bars are under 10 h. Select a bar to open that week.</p></section>';

  h+='<section><h2>Milestones</h2><ul class="miles">'+MILES.map(function(m){return '<li><a href="#w'+m.w+'"'+(gw(m.w).d?' class="on"':'')+'>'+esc(m.t)+'</a></li>';}).join('')+'</ul></section>';
  return h;
}

/* week workspace */

/* journal */
function journalText(){
  var tt=totals(),lines=['ARENA tracker: '+tt.done+' of 42 weeks done, '+fmtH(tt.hours)+' hours logged'];
  for(var n=1;n<=42;n++){
    var g=gw(n),st=stepStat(n);
    if(!(g.d||g.h||st.d||hasText(g)))continue;
    lines.push('','Week '+n+(g.d?' [done] ':' [open] ')+W[n-1][1]+' ('+st.d+'/'+st.n+' steps'+(g.h?', '+fmtH(g.h)+' h':'')+')');
    (g.s||[]).forEach(function(x,i){if(x&&x.trim())lines.push('  '+SUM[i]+': '+x.trim());});
    if(g.n&&g.n.trim())lines.push('  Notes: '+g.n.trim().replace(/\n/g,'\n  '));
  }
  return lines.join('\n');
}
function viewJournal(){
  var h='<header><div class="eyebrow">Everything you have written</div><h1>Journal</h1><p class="lede">Your summaries and notes, week by week. Use the search box to find a word in any entry.</p></header>';

    (g.s||[]).forEach(function(x,i){if(x&&x.trim())h+='<dt>'+SUM[i]+'</dt><dd>'+esc(x.trim())+'</dd>';});
    h+='</dl>'+(g.n&&g.n.trim()?'<pre>'+esc(g.n.trim())+'</pre>':'')+'<div class="actions"><a class="btn sm" href="#w'+n+'">Edit week '+n+'</a></div></article>';
  }
  if(!any)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+(query?'No entry matches "'+esc(query)+'".':'Nothing written yet. Open a week and fill in the five-line summary or the notes box. Entries appear here as you type them.')+'</p></div>';

/* render, keeping keyboard focus where it was */
function render(){
  var r=route(),a=document.activeElement,fid=a&&a.id&&$('#view').contains(a)?a.id:null,ss=null,se=null;
  if(fid&&a.selectionStart!=null&&a.type!=='number'&&a.type!=='checkbox'){try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}}

  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}}}
  grow();renderSide();setStatus();

function grow(){
  document.querySelectorAll('.sum textarea').forEach(function(t){t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight+2)+'px';});
}
function addHours(n,v){
  var h=Math.min(60,Math.max(0,(+gw(n).h||0)+v));

}

/* events */
var view=$('#view');
view.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),r=route(),n=+b.getAttribute('data-n')||r.n;
  if(act==='done'){setW(n,{d:gw(n).d?0:1});}
  else if(act==='addh'){addHours(n,+b.getAttribute('data-v'));}
  else if(act==='rmstep'){
    var k=b.getAttribute('data-k'),g=gw(n),c=Object.assign({},g.c);delete c[k];
    setW(n,{x:(g.x||[]).filter(function(o){return o.i!==k;}),c:c});
  }
  else if(act==='tstart'){T={w:n,start:Date.now()};saveT();render();}
  else if(act==='tstop'){
    if(!T)return;
    var hrs=Math.round((Date.now()-T.start)/36e5*100)/100,tw=T.w;T=null;saveT();
    if(hrs>0)addHours(tw,hrs);else render();
  }
  else if(act==='copy'){
    var txt=journalText(),done=function(m){b.textContent=m;setTimeout(function(){b.textContent='Copy progress as text';},2000);};
    try{navigator.clipboard.writeText(txt).then(function(){done('Copied');},function(){done('Copy is blocked here');});}catch(err){done('Copy is blocked here');}
  }
});

  else if(t.hasAttribute('data-sum')){
    var s=(gw(r.n).s||[]).slice();while(s.length<5)s.push('');
    s[+t.getAttribute('data-sum')]=t.value;setW(r.n,{s:s},true);grow();
  }
  else if(t.id==='hours'){
    var v=parseFloat(t.value);v=isNaN(v)?null:Math.min(60,Math.max(0,v));
    setW(r.n,{h:v},true);
    $('#h-of').textContent=fmtH(v||0)+' of '+TARGET+' h';
    $('#h-fill').style.width=Math.min(100,(v||0)/TARGET*100)+'%';
  }
});
view.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id!=='addstep')return;
  var r=route(),inp=$('#newstep'),t=inp.value.trim();
  if(!t||r.v!=='week')return;
  var x=(gw(r.n).x||[]).concat([{i:'x'+Date.now().toString(36),t:t}]);
  inp.value='';setW(r.n,{x:x});$('#newstep').focus();
});
$('#q').addEventListener('input',function(e){
  query=e.target.value.trim().toLowerCase();
  if(route().v==='journal')render();else renderSide();
});
document.addEventListener('keydown',function(e){
  var t=e.target,typing=/^(INPUT|TEXTAREA)$/.test(t.tagName);
  if(e.key==='Escape'){document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');if(t.id==='q'){t.value='';query='';renderSide();t.blur();}return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  var r=route();
  if(e.key==='/'){e.preventDefault();document.body.classList.add('nav-open');$('#q').focus();}
  else if(e.key==='['&&r.v==='week'&&r.n>1){location.hash='w'+(r.n-1);}
  else if(e.key===']'&&r.v==='week'&&r.n<42){location.hash='w'+(r.n+1);}
});
$('#menu').addEventListener('click',function(){
  var o=document.body.classList.toggle('nav-open');this.setAttribute('aria-expanded',o?'true':'false');
});
$('#side').addEventListener('click',function(e){
  if(e.target.closest('a')){document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');}
});
document.addEventListener('click',function(e){
  if(document.body.classList.contains('nav-open')&&!e.target.closest('#side')&&!e.target.closest('#menu')){document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

/* start */
loadLocal();
render();
connect();
})();
</script>
